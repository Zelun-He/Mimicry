name: Repack original visitor atlas
on:
  push:
    branches:
      - fix/novice-full-sword-sprite
    paths:
      - scripts/repack-visitor-atlas.py
permissions:
  contents: write
jobs:
  repair-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pillow
      - run: python scripts/repack-visitor-atlas.py
      - name: Commit repaired original pixel art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/visitors.png
          if ! git diff --cached --quiet; then
            git commit -m "fix: replace cropped visitor atlas with complete five-frame sprites"
            git push
          fi
